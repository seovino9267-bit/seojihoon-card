:root{

  --accent-soft:#EAF1FE;
  --accent-dark:#16345C;
  --accent-contrast:#FFFFFF;

}
@media (prefers-color-scheme: dark){

}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{

.page{width:100%;max-width:420px;display:flex;flex-direction:column;gap:20px}

.card{
  background:var(--card-bg);
  border-radius:22px;
  box-shadow:var(--shadow);
  padding:32px 26px;
}

/* ---- 프로필 카드 ---- */
.profile-card{display:flex;flex-direction:column;align-items:center;text-align:center}
.avatar{

}
.name{

  letter-spacing:.28em;padding-left:.28em;

}
.romanization{margin:6px 0 0;font-size:.85rem;color:var(--muted);letter-spacing:.02em}

.divider{width:28px;height:1px;background:var(--line);margin:18px 0}

.office{margin:0;font-size:.9rem;font-weight:600;color:var(--accent)}
.tagline{margin:14px 0 0;font-size:.92rem;color:var(--muted);max-width:26ch}

.icon-btn{

  padding:16px 8px;border:1px solid var(--line);border-radius:16px;
  text-decoration:none;color:var(--fg);font-size:.82rem;font-weight:600;
}
.icon-circle{
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--accent-soft);color:var(--accent);
}
.icon-circle svg{width:19px;height:19px}

.icon-btn{
  font-family:inherit;background:none;cursor:pointer;
  appearance:none;-webkit-appearance:none;width:100%;
}
.icon-circle svg.ic-done{display:none}
.icon-btn.copied .icon-circle svg.ic-mail{display:none}
.icon-btn.copied .icon-circle svg.ic-done{display:block}
.icon-btn.copied .icon-circle{background:var(--badge-c-bg);color:var(--badge-c-fg)}

.cta{
  display:flex;align-items:center;justify-content:center;gap:8px;

}
.cta svg{width:18px;height:18px;flex:none}

.visit{

}
.visit-note{display:block;margin-top:2px}
.visit-note strong{color:var(--fg);font-weight:700}

.toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,12px);
  background:var(--fg);color:var(--page-bg);
  padding:11px 18px;border-radius:999px;
  font-size:.82rem;font-weight:600;letter-spacing:.01em;
  box-shadow:0 6px 20px rgba(0,0,0,.22);
  opacity:0;pointer-events:none;transition:opacity .18s ease, transform .18s ease;
  z-index:50;max-width:92vw;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.manual{pointer-events:auto;user-select:text;-webkit-user-select:text}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

/* ---- 섹션 공통 ---- */
.section-title{

/* ---- 전문 분야 리스트 ---- */
.list{display:flex;flex-direction:column;gap:10px}

.chevron{flex:none;color:var(--muted)}
.chevron svg{width:18px;height:18px;display:block}

/* ---- 활동 갤러리 ---- */
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gallery figure{margin:0}
.gallery a{display:block}
.gallery img{

}
.gallery figcaption{margin-top:6px;font-size:.7rem;color:var(--muted);line-height:1.4}
.gallery figcaption .note{display:inline-block;margin-top:2px;font-size:.65rem;opacity:.75}

/* ---- 푸터 ---- */
.foot{text-align:center;font-size:.78rem;color:var(--muted);padding:4px 0}
.foot p{margin:0 0 4px}

a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

@media print{

  .card,.list-item{box-shadow:none;border:1px solid #ccc}

}

<script>
(function(){
  var btn = document.getElementById('mailBtn');
  var toastEl = document.getElementById('toast');
  var label = btn ? btn.querySelector('.btn-label') : null;
  var timer, labelTimer;

  function toast(msg, manual){
    toastEl.textContent = msg;
    toastEl.classList.toggle('manual', !!manual);
    toastEl.classList.add('show');
    clearTimeout(timer);
    timer = setTimeout(function(){ toastEl.classList.remove('show'); }, manual ? 7000 : 2200);
  }

  function manualCopy(mail){
    toast(mail + ' — 길게 눌러 복사해 주세요', true);
  }

  function legacyCopy(text){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly','');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch(e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function done(mail){
    btn.classList.add('copied');
    if (label) label.textContent = '복사됨';
    clearTimeout(labelTimer);
    labelTimer = setTimeout(function(){
      btn.classList.remove('copied');
      if (label) label.textContent = '이메일 복사';
    }, 1800);
    toast(mail + ' 복사됨');
  }

  if (btn) {
    btn.addEventListener('click', function(){
      var mail = btn.getAttribute('data-mail');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(mail).then(function(){ done(mail); }, function(){
          if (legacyCopy(mail)) { done(mail); } else { manualCopy(mail); }
        });
      } else if (legacyCopy(mail)) {
        done(mail);
      } else {
        manualCopy(mail);
      }
    });
  }
})();
</script>
