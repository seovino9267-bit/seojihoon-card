<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>전단 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#E8ECEF; --panel:#FFFFFF; --panel-2:#F3F5F7; --ink:#13202C; --muted:#5A6774; --line:#D5DBE1;
  --road:#FFFFFF; --road-edge:#BFC8D1; --alley:#FFFFFF; --alley-edge:#CDD4DB; --label:#475563; --halo:#FFFFFF;
  --plate:#1C4D8E; --plate-ink:#FFFFFF; --todo:#1C4D8E; --done:#2E8756; --skip:#B07A17;
  --me:#1A73E8; --shadow:0 8px 24px rgba(19,32,44,.18);
  --f-sign:"Do Hyeon","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E141A; --panel:#161E27; --panel-2:#1C2530; --ink:#E3E9EF; --muted:#8D9AA7; --line:#2A3440;
    --road:#2D3845; --road-edge:#0A0F14; --alley:#242E39; --alley-edge:#0B1016; --label:#9DAAB7; --halo:#0E141A;
    --plate:#3C76CE; --plate-ink:#FFFFFF; --todo:#3C76CE; --done:#45B376; --skip:#D6A443;
    --me:#5A9BFF; --shadow:0 8px 24px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --ground:#0E141A; --panel:#161E27; --panel-2:#1C2530; --ink:#E3E9EF; --muted:#8D9AA7; --line:#2A3440;
  --road:#2D3845; --road-edge:#0A0F14; --alley:#242E39; --alley-edge:#0B1016; --label:#9DAAB7; --halo:#0E141A;
  --plate:#3C76CE; --plate-ink:#FFFFFF; --todo:#3C76CE; --done:#45B376; --skip:#D6A443;
  --me:#5A9BFF; --shadow:0 8px 24px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--plate);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
.top{display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0;flex:1}
.brand b{font-family:var(--f-sign);font-weight:400;font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small b{font-family:var(--f-body);font-size:12px;font-weight:700;color:var(--done)}
.sync{flex:none;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync[data-s="synced"] i{background:var(--done)}
.sync[data-s="pending"] i{background:var(--skip)}

.wrap{position:relative;min-height:0;overflow:hidden;background:var(--ground)}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:grab;user-select:none;-webkit-user-select:none}
#map path{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
#rm-o{stroke:var(--road-edge);stroke-width:12px}
#rm-i{stroke:var(--road);stroke-width:10px}
#ra-o{stroke:var(--alley-edge);stroke-width:7px}
#ra-i{stroke:var(--alley);stroke-width:5.5px}
.lb{font-family:var(--f-body);font-size:12px;font-weight:500;fill:var(--label);text-anchor:middle;dominant-baseline:central;
  paint-order:stroke;stroke:var(--halo);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.lb.m{font-weight:700;font-size:12.5px}
.mk{pointer-events:none}
.mk .c{fill:var(--todo);stroke:var(--panel);stroke-width:2}
.mk text{font-family:var(--f-sign);font-size:13px;fill:#fff;text-anchor:middle;dominant-baseline:central}
.mk.done .c{fill:var(--done)}
.mk.skip .c{fill:var(--skip)}
.mk .ring{fill:none;stroke:var(--ink);stroke-width:3;display:none}
.mk.sel .ring{display:inline}
.mini .mk .b{transform:scale(.42)}
.mini .mk text{display:none}
.mini .mk.sel .b{transform:scale(.85)}
.mini .mk.sel text{display:inline}
#meAcc{fill:var(--me);fill-opacity:.12;stroke:var(--me);stroke-opacity:.35;stroke-width:1px}
.me-h{fill:#fff}.me-d{fill:var(--me)}

.fabs{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:8px;z-index:3}
.fab{width:46px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);
  display:grid;place-items:center;cursor:pointer;font-size:20px;line-height:1}
.fab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fab[aria-pressed="true"]{background:var(--me);border-color:var(--me);color:#fff}
.scale{position:absolute;left:12px;top:12px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;z-index:2;
  background:color-mix(in srgb,var(--panel) 85%,transparent);padding:3px 7px;border-radius:6px;pointer-events:none}
.scale i{display:block;height:4px;border:1.5px solid var(--muted);border-top:0;margin-top:2px}

.card{position:absolute;left:10px;right:10px;bottom:10px;margin:0 auto;max-width:520px;z-index:5;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px 14px;display:grid;gap:8px}
.card .hd{display:flex;align-items:center;gap:12px;padding-right:30px}
.plate{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:88px;background:var(--plate);color:var(--plate-ink);
  border-radius:6px;padding:5px 9px 6px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.85),inset 0 0 0 3px var(--plate)}
.plate .pr{font-family:var(--f-sign);font-size:12.5px;line-height:1.1;white-space:nowrap}
.plate .pn{font-family:var(--f-sign);font-size:27px;line-height:1.05;font-variant-numeric:tabular-nums}
.card h2{margin:0;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.card h2 small{display:block;font-size:13px;font-weight:500;color:var(--muted)}
.st{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;color:#fff;vertical-align:2px;margin-left:4px}
.st.done{background:var(--done)}.st.skip{background:var(--skip)}
.fly{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.fly b{font-family:var(--f-sign);font-weight:400;font-size:30px;line-height:1}
.fly span{color:var(--muted);font-size:13.5px}
.note{margin:0;font-size:12.5px;color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:50px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);font-weight:700;font-size:15px;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.go{background:var(--done);border-color:var(--done);color:#fff;flex:1 1 150px;font-size:18px}
.btn.no{color:var(--skip)}
.x{position:absolute;right:6px;top:6px;border:0;background:none;font-size:24px;color:var(--muted);width:40px;height:40px;cursor:pointer}

.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:10px;
  font-size:14px;max-width:min(80%,460px);box-shadow:var(--shadow);z-index:9;text-align:center}
</style>
</head>
<body>


<div class="app">
  <header class="top">
    <div class="brand"><b>송파 전단 지도</b><small id="total"></small></div>
    <div class="sync" id="sync" data-s="local"><i></i><span>이 기기에 저장</span></div>
  </header>
  <div class="wrap" id="wrap">
    <svg id="map" xmlns="http://www.w3.org/2000/svg" aria-label="전단 배포 지도">
      <g id="scene"><path id="ra-o"/><path id="ra-i"/><path id="rm-o"/><path id="rm-i"/><g id="gMk"></g></g>
      <g id="gLab"></g>
      <circle id="meAcc" r="0" style="display:none"/>
      <g id="meDot" style="display:none"><circle class="me-h" r="10"/><circle class="me-d" r="6.5"/></g>
    </svg>
    <div class="scale" id="scale"><span></span><i></i></div>
    <div class="fabs">
      <button class="fab" id="bMe" aria-pressed="false" title="내 위치" aria-label="내 위치 따라가기"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
      <button class="fab" id="bFit" title="전체 보기" aria-label="전체 보기"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="fab" id="bIn" aria-label="확대">+</button>
      <button class="fab" id="bOut" aria-label="축소">−</button>
    </div>
    <section class="card" id="card" hidden>
      <div class="hd">
        <div class="plate"><span class="pr" id="cRoad"></span><span class="pn" id="cBno"></span></div>
        <h2 id="cJ"></h2>
      </div>
      <div class="fly"><b id="cFly"></b><span id="cMeta"></span></div>
      <p class="note" id="cNote"></p>
      <div class="acts">
        <button class="btn go" id="aDone">넣었음</button>
        <button class="btn" id="aUndo" hidden>되돌리기</button>
        <button class="btn no" id="aSkip">못 넣음</button>
        <a class="btn" id="aNav" target="_blank" rel="noopener">카카오맵 길찾기</a>
      </div>
      <button class="x" id="cX" aria-label="닫기">×</button>
    </section>
    <div class="toast" id="toast" hidden></div>
  </div>
</div>


<style>
#lock{position:fixed;inset:0;z-index:50;background:var(--ground);display:grid;place-items:center;padding:24px}
#lock form{width:min(340px,100%);display:grid;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow)}
#lock b{font-family:var(--f-sign);font-weight:400;font-size:26px}
#lock p{margin:0;color:var(--muted);font-size:13.5px}
#lock input[type=password]{font:inherit;font-size:18px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);color:var(--ink);width:100%}
#lock label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
#lock button{min-height:48px;border:0;border-radius:10px;background:var(--plate);color:var(--plate-ink);font-size:17px;font-weight:700;cursor:pointer}
#lock .err{color:var(--next);min-height:1.2em}
</style>
<div id="lock" hidden>
  <form id="lockf" autocomplete="on">
    <b>전단 지도</b>
    <p>비밀번호를 넣으면 지도가 열립니다.</p>
    <input type="text" name="username" value="전단지도" autocomplete="username" hidden>
    <input id="lockpw" type="password" autocomplete="current-password" placeholder="비밀번호" required>
    <label><input id="lockrem" type="checkbox" checked> 이 휴대폰에서 기억</label>
    <button type="submit">열기</button>
    <p class="err" id="lockerr"></p>
  </form>
</div>
<script type="text/plain" id="appsrc">

const LK = 'songpa-flyer-v1:';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls = (k, v) => { try { if (v === undefined) return JSON.parse(localStorage.getItem(LK+k)); localStorage.setItem(LK+k, JSON.stringify(v)); } catch(e) { return null; } };

/* ── 데이터: 번호는 구분용 — 지역 전체에서 1번부터 ─────────── */
const P = DATA.pts.map(a => ({day:a[0], seq:a[1], road:a[2], bno:a[3], jibun:a[4], type:a[5], fly:a[6], fl:a[7], appr:a[8],
  note:a[9], pk:String(a[10]), x:a[11], y:a[12], lat:a[13], lon:a[14]})).sort((a,b) => a.day - b.day || a.seq - b.seq);
P.forEach((p, i) => { p.i = i; p.no = i + 1; });

/* ── 체크 저장: 이 기기(localStorage) + Claude에서 열면 기기 간(db) ── */
let checks = ls('checks') || (DATA.seed || {});
let pending = ls('pending') || {};
let db = null, dbLive = false, flushing = false;
const st = p => (checks[p.pk] || {}).s || '';

function setSync(){
  const el = $('#sync'), n = Object.keys(pending).length;
  const [s, txt] = !db ? ['local', '이 기기에 저장'] : n ? ['pending', '전송 대기 '+n+'건'] : dbLive ? ['synced', '기기 간 동기화됨'] : ['pending', '연결 중'];
  el.dataset.s = s; el.querySelector('span').textContent = txt;
}
function persist(){ ls('checks', checks); ls('pending', pending); setSync(); }
function mark(p, s){
  const t = Date.now();
  if (s) { checks[p.pk] = {s, t}; pending[p.pk] = {s, t, d:p.day}; }
  else { delete checks[p.pk]; pending[p.pk] = {del:true, t}; }
  persist(); flush(); paintMk(p); renderTotal();
}
async function flush(){
  if (!db || flushing) return; flushing = true;
  for (const [pk, w] of Object.entries(Object.assign({}, pending))) {
    try {
      const ref = db.doc('checks/' + pk);
      if (w.del) await ref.delete(); else await ref.set({s:w.s, t:w.t, d:w.d});
      if (pending[pk] && pending[pk].t === w.t) delete pending[pk];
    } catch(e) {
      if (e && e.code === 'quota_exceeded') toast('서버 저장 한도에 닿았습니다. 체크는 이 기기에 계속 남습니다.');
      break;
    }
  }
  flushing = false; persist();
}
(async () => {
  try {
    if (!window.claude || !window.claude.use) return setSync();
    db = await window.claude.use('db'); setSync();
    if (!db) return;
    db.collection('checks').onSnapshot(snap => {
      const next = {};
      snap.docs.forEach(d => { const v = d.data(); if (v && v.s) next[d.id] = {s:v.s, t:v.t}; });
      for (const [pk, w] of Object.entries(pending)) { if (w.del) delete next[pk]; else next[pk] = {s:w.s, t:w.t}; }
      checks = next; dbLive = true; persist(); P.forEach(paintMk); renderTotal(); if (sel) showCard(sel);
      flush();
    }, () => { db = null; dbLive = false; setSync(); });
    flush();
  } catch(e) { db = null; setSync(); }
})();
setInterval(flush, 20000);
addEventListener('online', flush);

/* ── 도로 · 이름 ─────────────────────────────────────────── */
const LABELS = [];
(function(){
  let am = '', mm = '';
  for (const [name, lines] of Object.entries(DATA.roads)) {
    const alley = !name || name === '(이름없음)' || /길$/.test(name);
    let best = null;
    for (const f of lines) {
      let d = 'M'+f[0]+' '+f[1];
      for (let k = 2; k < f.length; k += 2) d += 'L'+f[k]+' '+f[k+1];
      if (alley) am += d; else mm += d;
      if (!best || f.length > best.length) best = f;
    }
    if (best && name && name !== '(이름없음)') { const m = Math.floor(best.length / 4) * 2; LABELS.push({name, x:best[m], y:best[m+1], alley}); }
  }
  $('#ra-o').setAttribute('d', am); $('#ra-i').setAttribute('d', am);
  $('#rm-o').setAttribute('d', mm); $('#rm-i').setAttribute('d', mm);
  $('#gLab').innerHTML = LABELS.map(l => '<text class="lb'+(l.alley ? '' : ' m')+'" style="display:none">'+esc(l.name)+'</text>').join('');
  LABELS.forEach((l, i) => l.el = $('#gLab').children[i]);
})();

/* ── 번호 ─────────────────────────────────────────────────── */
let sel = null;
$('#gMk').innerHTML = P.map(p => '<g class="mk"><g class="b"><circle class="ring" r="17"/><circle class="c" r="13"/><text>'+p.no+'</text></g></g>').join('');
P.forEach((p, i) => p.el = $('#gMk').children[i]);
function paintMk(p){ const s = st(p); p.el.setAttribute('class', 'mk' + (s ? ' '+s : '') + (p === sel ? ' sel' : '')); }
P.forEach(paintMk);
function renderTotal(){
  const done = P.filter(p => st(p) === 'done');
  const left = P.filter(p => st(p) !== 'done').reduce((a, p) => a + (p.fly || 0), 0);
  $('#total').innerHTML = '넣음 <b>'+done.length.toLocaleString()+'</b> / '+P.length.toLocaleString()+'곳 · 남은 전단 '+left.toLocaleString()+'장';
}
renderTotal();

/* ── 지도 틀: 끌기 · 두 손가락 · 바퀴 ─────────────────────── */
const svg = $('#map'), scene = $('#scene');
const MINI_K = 0.9;
let W = 0, H = 0, view = {cx:0, cy:0, k:1}, lastK = -1, raf = 0, saveT = 0;
const sx = x => W/2 + (x - view.cx) * view.k;
const sy = y => H/2 + (y - view.cy) * view.k;
function draw(){ if (!raf) raf = requestAnimationFrame(applyView); }
function applyView(){
  raf = 0; if (!W) return;
  scene.setAttribute('transform', 'translate('+(W/2 - view.cx*view.k)+' '+(H/2 - view.cy*view.k)+') scale('+view.k+')');
  if (view.k !== lastK) {
    const inv = 1 / view.k;
    for (const p of P) p.el.setAttribute('transform', 'translate('+p.x+' '+p.y+') scale('+inv+')');
    svg.classList.toggle('mini', view.k < MINI_K);
    lastK = view.k;
  }
  let n = 0;
  for (const l of LABELS) {
    const X = sx(l.x), Y = sy(l.y);
    const on = (l.alley ? view.k >= 1.1 : view.k >= 0.35) && X > 40 && X < W - 60 && Y > 20 && Y < H - 20 && n < 60;
    l.el.style.display = on ? '' : 'none';
    if (on) { n++; l.el.setAttribute('x', X.toFixed(1)); l.el.setAttribute('y', Y.toFixed(1)); }
  }
  if (me) {
    $('#meDot').setAttribute('transform', 'translate('+sx(me.x).toFixed(1)+' '+sy(me.y).toFixed(1)+')');
    $('#meAcc').setAttribute('cx', sx(me.x)); $('#meAcc').setAttribute('cy', sy(me.y));
    $('#meAcc').setAttribute('r', Math.max(10, Math.min(me.acc, 300) * view.k));
  }
  const want = 90 / view.k;
  const step = [10, 20, 25, 50, 100, 200, 250, 500, 1000, 2000].reduce((a, b) => Math.abs(b - want) < Math.abs(a - want) ? b : a);
  $('#scale i').style.width = (step * view.k).toFixed(0) + 'px';
  $('#scale span').textContent = step >= 1000 ? (step / 1000) + 'km' : step + 'm';
  clearTimeout(saveT); saveT = setTimeout(() => ls('view', view), 600);
}
let needFit = false;
function resize(){
  const r = svg.getBoundingClientRect(); W = r.width; H = r.height; svg.setAttribute('viewBox', '0 0 '+W+' '+H);
  if (needFit && W > 60 && H > 60) { needFit = false; fit(P); } else applyView();
}
function fit(list){
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of list) { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); }
  view.cx = (x0 + x1) / 2; view.cy = (y0 + y1) / 2;
  view.k = Math.max(0.03, Math.min(W / Math.max(x1 - x0 + 80, 60), H / Math.max(y1 - y0 + 80, 60), 4));
  draw();
}
function zoomAt(mx, my, f){
  const k0 = view.k, k1 = Math.max(0.03, Math.min(8, k0 * f)); if (k1 === k0) return;
  const wx = view.cx + (mx - W/2) / k0, wy = view.cy + (my - H/2) / k0;
  view.cx = wx - (mx - W/2) / k1; view.cy = wy - (my - H/2) / k1; view.k = k1; draw();
}
const ptrs = new Map(); let pinch = 0;
svg.addEventListener('pointerdown', e => {
  try { svg.setPointerCapture(e.pointerId); } catch(_) {}
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY, x0:e.clientX, y0:e.clientY, moved:false});
  if (ptrs.size === 2) { const v = [...ptrs.values()]; pinch = Math.hypot(v[0].x - v[1].x, v[0].y - v[1].y); v.forEach(q => q.moved = true); }
});
svg.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (Math.abs(e.clientX - p.x0) + Math.abs(e.clientY - p.y0) > 6) p.moved = true;
  if (ptrs.size === 2) {
    const v = [...ptrs.values()], d = Math.hypot(v[0].x - v[1].x, v[0].y - v[1].y), r = svg.getBoundingClientRect();
    if (pinch) zoomAt((v[0].x + v[1].x)/2 - r.left, (v[0].y + v[1].y)/2 - r.top, d / pinch);
    pinch = d;
  } else if (p.moved) { view.cx -= dx / view.k; view.cy -= dy / view.k; setFollow(false); draw(); }
});
function endPtr(e){ const p = ptrs.get(e.pointerId); ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = 0; return p; }
svg.addEventListener('pointerup', e => { const p = endPtr(e); if (p && !p.moved) { const r = svg.getBoundingClientRect(); tapAt(e.clientX - r.left, e.clientY - r.top); } });
svg.addEventListener('pointercancel', endPtr);
svg.addEventListener('wheel', e => { e.preventDefault(); const r = svg.getBoundingClientRect(); zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0016)); }, {passive:false});
$('#bIn').onclick = () => zoomAt(W/2, H/2, 1.6);
$('#bOut').onclick = () => zoomAt(W/2, H/2, 1/1.6);
$('#bFit').onclick = () => { setFollow(false); fit(P); };

/* ── 번호 누르기 → 넣었음 카드 ─────────────────────────────── */
function tapAt(mx, my){
  const R = view.k < MINI_K ? 16 : 22;
  let best = null, bd = R;
  for (const p of P) { const d = Math.hypot(sx(p.x) - mx, sy(p.y) - my); if (d < bd) { bd = d; best = p; } }
  if (best) showCard(best); else closeCard();
}
function showCard(p){
  const prev = sel; sel = p; if (prev && prev !== p) paintMk(prev); paintMk(p);
  const s = st(p), yr = p.appr && p.appr.length >= 4 ? p.appr.slice(0, 4) + '년' : '';
  $('#cRoad').textContent = p.road || '';
  $('#cBno').textContent = p.bno || '—';
  $('#cJ').innerHTML = p.no + '번 · ' + esc(p.jibun) + (s === 'done' ? '<span class="st done">넣음</span>' : s === 'skip' ? '<span class="st skip">못 넣음</span>' : '')
    + '<small>' + esc([p.type, p.fl ? p.fl + '층' : '', yr].filter(Boolean).join(' · ')) + '</small>';
  $('#cFly').textContent = '전단 ' + (p.fly || 1) + '장';
  $('#cMeta').textContent = '';
  $('#cNote').textContent = p.note || ''; $('#cNote').hidden = !p.note;
  $('#aDone').hidden = s === 'done'; $('#aUndo').hidden = !s; $('#aSkip').hidden = s === 'skip';
  $('#aNav').href = 'https://map.kakao.com/link/to/' + encodeURIComponent(p.jibun) + ',' + p.lat + ',' + p.lon;
  $('#card').hidden = false;
}
function closeCard(){ const p = sel; sel = null; if (p) paintMk(p); $('#card').hidden = true; }
$('#cX').onclick = closeCard;
$('#aDone').onclick = () => { const p = sel; if (!p) return; mark(p, 'done'); closeCard(); toast(p.no + '번 넣었습니다 ✓'); };
$('#aSkip').onclick = () => { const p = sel; if (!p) return; mark(p, 'skip'); closeCard(); toast(p.no + '번 못 넣음으로 표시했습니다'); };
$('#aUndo').onclick = () => { const p = sel; if (!p) return; mark(p, null); showCard(p); };
addEventListener('keydown', e => { if (e.key === 'Escape') closeCard(); });

/* ── 내 위치 ──────────────────────────────────────────────── */
let me = null, follow = false, watchId = null;
function setFollow(v){ follow = v; $('#bMe').setAttribute('aria-pressed', String(v)); }
$('#bMe').onclick = () => {
  if (!('geolocation' in navigator)) return toast('이 기기에서는 위치를 받을 수 없습니다.');
  if (me) { setFollow(true); view.cx = me.x; view.cy = me.y; if (view.k < 1.6) view.k = 1.6; draw(); return; }
  const pol = document.permissionsPolicy || document.featurePolicy;
  if (pol && pol.allowsFeature && !pol.allowsFeature('geolocation'))
    return toast('이 보기 화면이 위치 기능을 막고 있습니다. 「카카오맵 길찾기」를 써 주세요. [보기 화면 차단]', 10000);
  toast('내 위치를 찾는 중입니다…');
  const t0 = Date.now();
  setFollow(true);
  watchId = navigator.geolocation.watchPosition(pos => {
    const c = pos.coords, first = !me;
    me = {x:(c.longitude - DATA.cx) * DATA.kx, y:-(c.latitude - DATA.cy) * DATA.ky, acc:c.accuracy || 30};
    $('#meDot').style.display = ''; $('#meAcc').style.display = '';
    const inside = Math.abs(me.x) < 8000 && Math.abs(me.y) < 8000;
    if (first) { hideToast(); if (!inside) toast('지금 위치가 배포 구역 밖입니다. 구역에 들어오면 파란 점이 따라옵니다.'); else if (view.k < 1.6) view.k = 1.6; }
    if (follow && inside) { view.cx = me.x; view.cy = me.y; }
    draw();
  }, err => {
    setFollow(false);
    const why = err.code === 1
      ? (Date.now() - t0 < 1500 ? '위치 권한이 묻지도 않고 거절됐습니다. 휴대폰 설정에서 위치 권한을 확인해 주세요.' : '위치 사용을 허용하지 않으셨습니다.')
      : err.code === 3 ? '20초 안에 위치를 못 잡았습니다. 하늘이 트인 곳에서 다시 눌러 주세요.' : '위치를 아직 못 잡았습니다. 다시 눌러 주세요.';
    toast(why + ' [코드 ' + err.code + (err.message ? ' · ' + err.message : '') + ']', 10000);
    if (watchId !== null) navigator.geolocation.clearWatch(watchId); watchId = null;
  }, {enableHighAccuracy:true, maximumAge:5000, timeout:20000});
};

let tt = 0;
function toast(m, ms){ const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(hideToast, ms || 2600); }
function hideToast(){ $('#toast').hidden = true; }

/* ── 시작 ─────────────────────────────────────────────────── */
addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(svg);
const saved = ls('view');
if (saved && isFinite(saved.cx) && isFinite(saved.k) && saved.k > 0) view = saved; else needFit = true;   // 화면 크기가 잡힌 뒤에 맞춘다
resize();
setSync();

  const b64 = t => Uint8Array.from(atob(t), ch => ch.charCodeAt(0));
  const toB64 = u => { let r = ""; for (let x = 0; x < u.length; x++) r += String.fromCharCode(u[x]); return btoa(r); };
  async function derive(pw){
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", salt:b64(ENC.s), iterations:ENC.n, hash:"SHA-256"}, base, 256));
  }
  async function unseal(raw){
    const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(ENC.i)}, key, b64(ENC.c)));
  }
  function boot(json){
    document.getElementById("lock").remove();
    const sc = document.createElement("script");
    sc.textContent = "const DATA = " + json + ";\n" + document.getElementById("appsrc").textContent;
    document.body.appendChild(sc);
  }
  const lock = document.getElementById("lock"), err = document.getElementById("lockerr");
  (async () => {
    let saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) {}
    if (saved) { try { boot(await unseal(b64(saved))); return; } catch (e) { try { localStorage.removeItem(KEY); } catch (_) {} } }
    lock.hidden = false; document.getElementById("lockpw").focus();
  })();
  document.getElementById("lockf").addEventListener("submit", async e => {
    e.preventDefault(); err.textContent = "여는 중…";
    try {
      const raw = await derive(document.getElementById("lockpw").value);
      const json = await unseal(raw);
      if (document.getElementById("lockrem").checked) { try { localStorage.setItem(KEY, toB64(raw)); } catch (_) {} }
      boot(json);
    } catch (x) { err.textContent = "비밀번호가 맞지 않습니다."; }
  });
