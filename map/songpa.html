<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>전단 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#E8ECEF; --panel:#FFFFFF; --panel-2:#F3F5F7; --ink:#13202C; --muted:#5A6774; --line:#D5DBE1;
  --road:#FFFFFF; --road-edge:#BFC8D1; --alley:#FFFFFF; --alley-edge:#CDD4DB; --label:#475563; --halo:#FFFFFF;
  --plate:#1C4D8E; --plate-ink:#FFFFFF; --next:#D7261E; --done:#2E8756; --skip:#B07A17; --faint:#A3AEB9;
  --me:#1A73E8; --shadow:0 8px 24px rgba(19,32,44,.18);
  --f-sign:"Do Hyeon","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E141A; --panel:#161E27; --panel-2:#1C2530; --ink:#E3E9EF; --muted:#8D9AA7; --line:#2A3440;
    --road:#2D3845; --road-edge:#0A0F14; --alley:#242E39; --alley-edge:#0B1016; --label:#9DAAB7; --halo:#0E141A;
    --plate:#3C76CE; --plate-ink:#FFFFFF; --next:#FF4D45; --done:#45B376; --skip:#D6A443; --faint:#4E5A67;
    --me:#5A9BFF; --shadow:0 8px 24px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --ground:#0E141A; --panel:#161E27; --panel-2:#1C2530; --ink:#E3E9EF; --muted:#8D9AA7; --line:#2A3440;
  --road:#2D3845; --road-edge:#0A0F14; --alley:#242E39; --alley-edge:#0B1016; --label:#9DAAB7; --halo:#0E141A;
  --plate:#3C76CE; --plate-ink:#FFFFFF; --next:#FF4D45; --done:#45B376; --skip:#D6A443; --faint:#4E5A67;
  --me:#5A9BFF; --shadow:0 8px 24px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  -webkit-text-size-adjust:100%;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--next);outline-offset:2px}

.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto 1fr}

/* ── 머리띠 ─────────────────────────── */
.top{display:flex;align-items:center;gap:14px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;flex-direction:column;flex:none;line-height:1.1}
.brand b{font-family:var(--f-sign);font-weight:400;font-size:22px;letter-spacing:.01em}
.brand small{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding:2px}
.days::-webkit-scrollbar{display:none}
.day{flex:none;display:grid;grid-template-rows:auto auto 4px;justify-items:center;gap:1px;width:52px;padding:5px 0 6px;
  border:1px solid var(--line);border-radius:8px;background:var(--panel-2);cursor:pointer}
.day .n{font-family:var(--f-sign);font-size:19px;line-height:1}
.day .g{font-size:10.5px;color:var(--muted);white-space:nowrap}
.day .bar{width:34px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.day .bar i{display:block;height:100%;background:var(--done)}
.day[aria-pressed="true"]{background:var(--plate);border-color:var(--plate);color:var(--plate-ink)}
.day[aria-pressed="true"] .g{color:var(--plate-ink);opacity:.85}
.day[aria-pressed="true"] .bar{background:rgba(255,255,255,.3)}
.day[aria-pressed="true"] .bar i{background:#fff}
.day.full:not([aria-pressed="true"]) .n::after{content:" ✓";color:var(--done);font-size:13px}
.sync{flex:none;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.sync[data-s="synced"] i{background:var(--done)}
.sync[data-s="pending"] i{background:var(--skip)}

/* ── 본문: 지도 + 목록 ─────────────── */
main{display:grid;grid-template-columns:minmax(0,1fr) 370px;min-height:0}
@media (max-aspect-ratio:1/1), (max-width:760px){
  main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,56fr) minmax(0,44fr)}
  .list{border-left:0;border-top:1px solid var(--line)}
}
.mapwrap{position:relative;min-height:0;overflow:hidden;background:var(--ground)}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:grab;user-select:none;-webkit-user-select:none}
#map path{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
#map .rc.m{stroke:var(--road-edge);stroke-width:var(--wmc)}
#map .rf.m{stroke:var(--road);stroke-width:var(--wm)}
#map .rc.a{stroke:var(--alley-edge);stroke-width:var(--wac)}
#map .rf.a{stroke:var(--alley);stroke-width:var(--wa)}
#map #faint{stroke:var(--faint);stroke-width:4px;opacity:.8}
#map #rDone{stroke:var(--faint);stroke-width:2.5px;opacity:.7}
#map #rTodo{stroke:var(--plate);stroke-width:2.5px;opacity:.4}
#map #rNext{stroke:var(--next);stroke-width:6px;opacity:.95}
.lb{font-family:var(--f-body);font-size:12px;font-weight:500;fill:var(--label);text-anchor:middle;dominant-baseline:central;
  paint-order:stroke;stroke:var(--halo);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none;display:none}
.lb.m{font-weight:700;font-size:12.5px}
.z-main .lb.m{display:inline}
.z-alley .lb.a{display:inline}
.mk .c{fill:var(--plate);stroke:var(--panel);stroke-width:2}
.mk text{font-family:var(--f-sign);font-size:14px;fill:var(--plate-ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.mk.done .c{fill:var(--done);opacity:.72}
.mk.skip .c{fill:var(--skip)}
.mk.next .c{fill:var(--next)}
.mk .ring{fill:none;stroke:var(--next);stroke-width:3;opacity:.0}
.mk.next .ring{opacity:.9;animation:pulse 1.6s ease-out infinite;transform-origin:0 0}
.mk.sel .sel{fill:none;stroke:var(--ink);stroke-width:3}
.mini .mk .b{transform:scale(.42)}
.mini .mk text{display:none}
.mini .mk.sel .b, .mini .mk.next .b{transform:scale(.8)}
.mini .mk.sel text, .mini .mk.next text{display:inline}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.7);opacity:0}}
@media (prefers-reduced-motion:reduce){.mk.next .ring{animation:none}}
#meAcc{fill:var(--me);fill-opacity:.12;stroke:var(--me);stroke-opacity:.35;stroke-width:1px;vector-effect:non-scaling-stroke}
.me-h{fill:#fff}.me-d{fill:var(--me)}
.hm{fill:var(--ink);stroke:var(--panel);stroke-width:2}
.hmt{font-family:var(--f-sign);font-size:15px;fill:var(--panel);text-anchor:middle;dominant-baseline:central;pointer-events:none}

.fabs{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:8px}
.fab{width:46px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);
  display:grid;place-items:center;cursor:pointer;font-size:20px;line-height:1}
.fab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fab[aria-pressed="true"]{background:var(--me);border-color:var(--me);color:#fff}
.scale{position:absolute;left:12px;top:12px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;
  background:color-mix(in srgb,var(--panel) 85%,transparent);padding:3px 7px;border-radius:6px}
.scale i{display:block;height:4px;border:1.5px solid var(--muted);border-top:0;margin-top:2px}

/* ── 선택 카드 ─────────────────────── */
.card{position:absolute;left:12px;right:70px;bottom:12px;max-width:560px;background:var(--panel);border-radius:12px;box-shadow:var(--shadow);
  display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;padding:12px 14px 12px 12px;border:1px solid var(--line)}
.plate{grid-row:span 2;align-self:start;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:92px;
  background:var(--plate);color:var(--plate-ink);border-radius:6px;padding:6px 10px 7px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.85),inset 0 0 0 3px var(--plate)}
.plate .pr{font-family:var(--f-sign);font-size:13px;line-height:1.1;white-space:nowrap}
.plate .pn{font-family:var(--f-sign);font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums}
.card h2{margin:0;font-size:21px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card h2 .st{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--panel-2);color:var(--muted)}
.card h2 .st.done{background:var(--done);color:#fff}.card h2 .st.skip{background:var(--skip);color:#fff}
.card h2 .st.nx{background:var(--next);color:#fff}
.card .meta{margin:0;color:var(--muted);font-size:13.5px}
.card .meta b{color:var(--ink);font-weight:600}
.card .note{grid-column:1/-1;margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn{min-height:46px;padding:0 16px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);font-weight:600;font-size:15px;
  cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.go{background:var(--done);border-color:var(--done);color:#fff;flex:1 1 140px;justify-content:center;font-size:16px}
.btn.no{color:var(--skip)}
.btn.nav{margin-left:auto}
.x{position:absolute;right:6px;top:4px;border:0;background:none;font-size:22px;color:var(--muted);width:36px;height:36px;cursor:pointer}

/* ── 목록 ─────────────────────────── */
.list{border-left:1px solid var(--line);background:var(--panel);display:grid;grid-template-rows:auto 1fr;min-height:0}
.sum{padding:12px 14px 10px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.sum h1{margin:0;font-family:var(--f-sign);font-weight:400;font-size:24px;line-height:1.1;display:flex;align-items:baseline;gap:8px}
.sum h1 span{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:500}
.chips{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px;font-variant-numeric:tabular-nums}
.chip{padding:3px 9px;border-radius:99px;background:var(--panel-2);color:var(--muted)}
.chip b{color:var(--ink)}
.chip.ok b{color:var(--done)}.chip.warn b{color:var(--skip)}
.nextbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--next);border-radius:9px;
  background:color-mix(in srgb,var(--next) 10%,var(--panel));padding:8px 10px;cursor:pointer;min-height:46px}
.nextbtn .k{font-size:11.5px;color:var(--next);font-weight:700;letter-spacing:.04em}
.nextbtn .v{font-weight:600;font-variant-numeric:tabular-nums}
.nextbtn .arr{margin-left:auto;color:var(--next);font-size:18px}
.rows{overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch;padding-bottom:20px}
.grp{position:sticky;top:0;z-index:1;background:var(--panel-2);border-bottom:1px solid var(--line);padding:5px 14px;
  font-family:var(--f-sign);font-size:14px;color:var(--plate);display:flex;justify-content:space-between}
.grp small{font-family:var(--f-body);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.row{display:grid;grid-template-columns:34px minmax(0,1fr) auto 46px;align-items:center;gap:10px;padding:6px 8px 6px 14px;
  border-bottom:1px solid var(--line);cursor:pointer;min-height:54px}
.row .no{font-family:var(--f-sign);font-size:15px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--plate);color:var(--plate-ink)}
.row .j{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.row .t b{display:block;color:var(--ink);font-size:13px}
.tick{width:42px;height:42px;border-radius:9px;border:1.5px solid var(--line);background:var(--panel);cursor:pointer;display:grid;place-items:center;font-size:18px;color:transparent}
.row.done{background:color-mix(in srgb,var(--done) 7%,var(--panel))}
.row.done .no{background:var(--done)}
.row.done .j{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.row.done .tick{background:var(--done);border-color:var(--done);color:#fff}
.row.skip .no{background:var(--skip)}
.row.skip .tick{border-color:var(--skip);color:var(--skip)}
.row.next .no{background:var(--next)}
.row.sel{box-shadow:inset 4px 0 0 var(--ink)}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:10px;
  font-size:14px;max-width:min(92vw,520px);box-shadow:var(--shadow);z-index:9}

/* ── 휴대폰: 목록을 아래 서랍으로 (2026-09-16) ── */
:root{--peek:54px}
.sheetbar{display:none}
@media (max-aspect-ratio:1/1), (max-width:760px){
  main{grid-template-rows:minmax(0,1fr);position:relative}
  .list{position:absolute;left:0;right:0;bottom:0;height:min(64%,600px);z-index:6;border-top:1px solid var(--line);
    border-radius:16px 16px 0 0;box-shadow:0 -6px 22px rgba(0,0,0,.28);grid-template-rows:auto auto minmax(0,1fr);
    transform:translateY(calc(100% - var(--peek)));transition:transform .24s ease}
  .list.open{transform:translateY(0)}
  .sheetbar{display:flex;align-items:center;gap:10px;width:100%;min-height:var(--peek);padding:10px 14px 6px;border:0;
    background:transparent;cursor:pointer;position:relative;color:var(--ink);text-align:left}
  .sheetbar::before{content:"";position:absolute;left:50%;top:6px;width:40px;height:4px;border-radius:2px;background:var(--line);transform:translateX(-50%)}
  .sheetbar .sl{font-family:var(--f-sign);font-size:18px;white-space:nowrap}
  .sheetbar .ss{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .sheetbar .sa{margin-left:auto;font-size:13px;color:var(--plate);font-weight:700;white-space:nowrap}
  .card{bottom:calc(var(--peek) + 10px)}
  .toast{bottom:calc(var(--peek) + 16px)}
}
@media (prefers-reduced-motion:reduce){.list{transition:none}}

/* ── 휴대폰: 손잡이 줄 숨김 · 오른쪽 「목록」 버튼으로만 연다 (2026-09-16) ── */
#bList{display:none}
@media (max-aspect-ratio:1/1), (max-width:760px){
  :root{--peek:0px}
  .sheetbar{display:none}
  .list.open .sheetbar{display:flex}
  .list:not(.open){box-shadow:none;border-top:0}
  #bList{display:grid}
}
</style>
</head>
<body>


<div class="app">
  <header class="top">
    <div class="brand"><b>송파 전단 지도</b><small id="total">삼전·석촌·송파·방이</small></div>
    <nav class="days" id="days" aria-label="일차 선택"></nav>
    <div class="sync" id="sync" data-s="local" title="체크 저장 상태"><i></i><span>이 기기에 저장</span></div>
  </header>
  <main>
    <div class="mapwrap" id="wrap">
      <svg id="map" xmlns="http://www.w3.org/2000/svg" aria-label="배포 동선 지도">
        <g id="gCase"></g><g id="gFill"></g><path id="faint"/><path id="rDone"/><path id="rTodo"/><path id="rNext"/><g id="gLab"></g>
        <circle id="meAcc" r="0" cx="0" cy="0" style="display:none"/>
        <g id="gMk"></g>
        <g id="home" style="display:none"><rect class="hm" x="-16" y="-13" width="32" height="26" rx="6"/><text class="hmt">집</text></g>
        <g id="meDot" style="display:none"><circle class="me-h" r="10"/><circle class="me-d" r="6.5"/></g>
      </svg>
      <div class="scale" id="scale"><span></span><i></i></div>
      <div class="fabs">
        <button class="fab" id="bMe" aria-pressed="false" title="내 위치" aria-label="내 위치 따라가기"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
        <button class="fab" id="bFit" title="이 일차 전체 보기" aria-label="이 일차 전체 보기"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button class="fab" id="bIn" aria-label="확대">+</button>
        <button class="fab" id="bOut" aria-label="축소">−</button>
        <button class="fab" id="bList" aria-pressed="false" title="목록" aria-label="목록 열기"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
      </div>
      <section class="card" id="card" hidden>
        <div class="plate"><span class="pr" id="cRoad"></span><span class="pn" id="cNo"></span></div>
        <h2 id="cJ"></h2>
        <p class="meta" id="cMeta"></p>
        <p class="note" id="cNote"></p>
        <div class="acts">
          <button class="btn go" id="aDone">넣었음 · 다음 집</button>
          <button class="btn no" id="aSkip">못 넣음</button>
          <button class="btn" id="aUndo" hidden>되돌리기</button>
          <a class="btn nav" id="aNav" target="_blank" rel="noopener">카카오맵 길찾기</a>
        </div>
        <button class="x" id="cX" aria-label="닫기">×</button>
      </section>
    </div>
    <aside class="list">
      <button class="sheetbar" id="sheetBar" aria-expanded="false" aria-controls="rows"><span class="sl" id="sbL">목록</span><span class="ss" id="sbS"></span><span class="sa" id="sbA">펼치기 ▲</span></button>
      <div class="sum">
        <h1 id="sTitle"></h1>
        <div class="chips" id="sChips"></div>
        <button class="nextbtn" id="sNext"></button>
      </div>
      <div class="rows" id="rows"></div>
    </aside>
  </main>
</div>
<div class="toast" id="toast" hidden></div>


<style>
#lock{position:fixed;inset:0;z-index:50;background:var(--ground);display:grid;place-items:center;padding:24px}
#lock form{width:min(340px,100%);display:grid;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow)}
#lock b{font-family:var(--f-sign);font-weight:400;font-size:26px}
#lock p{margin:0;color:var(--muted);font-size:13.5px}
#lock input[type=password]{font:inherit;font-size:18px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);color:var(--ink);width:100%}
#lock label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
#lock button{min-height:48px;border:0;border-radius:10px;background:var(--plate);color:var(--plate-ink);font-size:17px;font-weight:700;cursor:pointer}
#lock .err{color:var(--next);min-height:1.2em}
</style>
<div id="lock" hidden>
  <form id="lockf" autocomplete="on">
    <b>전단 지도</b>
    <p>비밀번호를 넣으면 지도가 열립니다.</p>
    <input type="text" name="username" value="전단지도" autocomplete="username" hidden>
    <input id="lockpw" type="password" autocomplete="current-password" placeholder="비밀번호" required>
    <label><input id="lockrem" type="checkbox" checked> 이 휴대폰에서 기억</label>
    <button type="submit">열기</button>
    <p class="err" id="lockerr"></p>
  </form>
</div>
<script type="text/plain" id="appsrc">

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

/* ── 데이터 ─────────────────────────────────────────── */
const P = DATA.pts.map((a,i) => ({i, day:a[0], seq:a[1], road:a[2], bno:a[3], jibun:a[4], type:a[5], fly:a[6],
  fl:a[7], appr:a[8], note:a[9], pk:String(a[10]), x:a[11], y:a[12], lat:a[13], lon:a[14], dong:a[4].split(' ')[0]}));
const DAYS = [...new Set(P.map(p => p.day))].sort((a,b) => a-b);
const BY = new Map(DAYS.map(d => [d, P.filter(p => p.day === d).sort((a,b) => a.seq-b.seq)]));
const legD = f => f.reduce((s, v, k) => s + (k % 2 ? ' '+v : (k ? 'L' : 'M')+v), '');
const legM = f => { let m = 0; for (let k = 2; k < f.length; k += 2) m += Math.hypot(f[k]-f[k-2], f[k+1]-f[k-1]); return m; };
const walkTo = p => { const L = BY.get(p.day), i = L.indexOf(p), lg = DATA.legs && DATA.legs[p.day];
  return lg ? (i ? '앞 집에서 ' : '집에서 ') + Math.round(legM(lg[i])/10)*10 + 'm' : ''; };   // 도로를 따라 몇 m
const dongOf = d => [...new Set(BY.get(d).map(p => p.dong.replace('동','')))].join('·');

/* ── 저장: 이 기기(localStorage) + 기기 간(db) ─────── */
const LK = 'songpa-flyer-v1:';
const ls = (k, v) => { try { if (v === undefined) return JSON.parse(localStorage.getItem(LK+k)); localStorage.setItem(LK+k, JSON.stringify(v)); } catch(e) { return null; } };
let checks = ls('checks') || (DATA.seed || {});     // pk -> {s:'done'|'skip', t}
let pending = ls('pending') || {};   // pk -> {s,t,d} | {del:true,t}
let db = null, dbLive = false, flushing = false, marked = false;

function setSync(){
  const el = $('#sync'), n = Object.keys(pending).length;
  const [s, txt] = !db ? ['local', '이 기기에 저장'] : n ? ['pending', '전송 대기 '+n+'건'] : dbLive ? ['synced', '기기 간 동기화됨'] : ['pending', '연결 중'];
  el.dataset.s = s; el.querySelector('span').textContent = txt;
}
function persist(){ ls('checks', checks); ls('pending', pending); setSync(); }
function mark(p, s){
  const t = Date.now();
  if (s) { checks[p.pk] = {s, t}; pending[p.pk] = {s, t, d:p.day}; }
  else { delete checks[p.pk]; pending[p.pk] = {del:true, t}; }
  marked = true; savePos(p);
  persist(); flush();
}
// 멈춘 곳 — 마지막으로 체크한 집. 다음에 열면 그 다음 집부터 이어간다 (기기 간에도)
function savePos(p){
  pos = {day:p.day, pk:p.pk, t:Date.now()}; ls('pos', pos);
  if (db) db.doc('state/last').set(pos).catch(() => {});
}
async function flush(){
  if (!db || flushing) return; flushing = true;
  for (const [pk, w] of Object.entries(Object.assign({}, pending))) {
    try {
      const ref = db.doc('checks/' + pk);
      if (w.del) await ref.delete(); else await ref.set({s:w.s, t:w.t, d:w.d});
      if (pending[pk] && pending[pk].t === w.t) delete pending[pk];
    } catch(e) {
      if (e && e.code === 'quota_exceeded') toast('서버 저장 한도에 닿았습니다. 체크는 이 기기에 계속 남습니다.');
      break;
    }
  }
  flushing = false; persist();
}
(async () => {
  try {
    if (!window.claude || !window.claude.use) return setSync();
    db = await window.claude.use('db'); setSync();
    if (!db) return;
    try {   // 다른 기기에서 더 나중에 멈췄으면 그쪽을 따른다
      const s = await db.doc('state/last').get(), v = s.exists ? s.data() : null;
      if (v && v.pk && (!pos || (v.t || 0) > (pos.t || 0))) { pos = {day:v.day, pk:String(v.pk), t:v.t}; ls('pos', pos); }
    } catch(e) {}
    let first = true;
    db.collection('checks').onSnapshot(snap => {
      const next = {};
      snap.docs.forEach(d => { const v = d.data(); if (v && v.s) next[d.id] = {s:v.s, t:v.t}; });
      for (const [pk, w] of Object.entries(pending)) { if (w.del) delete next[pk]; else next[pk] = {s:w.s, t:w.t}; }
      checks = next; dbLive = true; persist();
      if (first && !touched && !marked) { const n = resumeTarget(); if (n && n !== sel) resume(true); else renderDay(false); }
      else renderDay(false);
      first = false; flush();
    }, () => { db = null; dbLive = false; setSync(); });
    flush();
  } catch(e) { db = null; setSync(); }
})();
setInterval(flush, 20000);
addEventListener('online', flush);
const st = p => (checks[p.pk] || {}).s || '';

/* ── 지도 틀 ─────────────────────────────────────────── */
const svg = $('#map'), wrap = $('#wrap');
let W = 800, H = 600, view = {x:0, y:0, s:1};
const toMap = (px, py) => ({x: view.x + (px - W/2)/view.s, y: view.y + (py - H/2)/view.s});

// 도로 — 이름 하나에 경로 하나
const LABELS = [];
(function buildRoads(){
  let cs = '', fs = '';
  for (const [name, lines] of Object.entries(DATA.roads)) {
    const al = !name || /길$/.test(name);
    let d = '';
    for (const f of lines) { d += 'M'+f[0]+' '+f[1]; for (let k = 2; k < f.length; k += 2) d += 'L'+f[k]+' '+f[k+1]; }
    cs += '<path class="rc '+(al?'a':'m')+'" d="'+d+'"/>'; fs += '<path class="rf '+(al?'a':'m')+'" d="'+d+'"/>';
    if (!name) continue;
    const cand = [];
    for (const f of lines) {
      let L = 0; for (let k = 2; k < f.length; k += 2) L += Math.hypot(f[k]-f[k-2], f[k+1]-f[k-1]);
      if (L >= (al ? 60 : 160)) cand.push([L, f]);
    }
    cand.sort((a,b) => b[0]-a[0]);
    const acc = [];
    for (const [L, f] of cand) {
      let h = L/2, x, y, a;
      for (let k = 2; k < f.length; k += 2) {
        const dx = f[k]-f[k-2], dy = f[k+1]-f[k-1], l = Math.hypot(dx, dy);
        if (h <= l) { const t = h/(l||1); x = f[k-2]+dx*t; y = f[k-1]+dy*t; a = Math.atan2(dy, dx)*180/Math.PI; break; }
        h -= l;
      }
      if (x === undefined) continue;
      if (a > 90) a -= 180; if (a <= -90) a += 180;
      if (acc.some(q => Math.hypot(q.x-x, q.y-y) < (al ? 260 : 600))) continue;
      acc.push({x, y}); LABELS.push({name, x, y, a, al});
      if (acc.length >= (al ? 2 : 6)) break;
    }
  }
  $('#gCase').innerHTML = cs; $('#gFill').innerHTML = fs;
  $('#gLab').innerHTML = LABELS.map(l => '<text class="lb '+(l.al?'a':'m')+'">'+esc(l.name)+'</text>').join('');
  [...$('#gLab').children].forEach((el, i) => LABELS[i].el = el);
})();

let MK = [];     // 이 일차 표식 [{el,p}]
let lastK = 0;
function applyView(){
  const w = W/view.s, h = H/view.s;
  svg.setAttribute('viewBox', (view.x - w/2)+' '+(view.y - h/2)+' '+w+' '+h);
  const s = view.s, k = 1/s;
  if (k !== lastK) {
    lastK = k;
    const wm = clamp(18*s, 3, 26), wa = clamp(6*s, 1.2, 13);
    svg.style.setProperty('--wm', wm+'px'); svg.style.setProperty('--wmc', (wm+2.5)+'px');
    svg.style.setProperty('--wa', wa+'px'); svg.style.setProperty('--wac', (wa+2)+'px');
    svg.classList.toggle('z-main', s > 0.22);
    svg.classList.toggle('z-alley', s > 1.05);
    svg.classList.toggle('mini', s < 0.55);
    for (const l of LABELS) if (l.al ? s > 1.05 : s > 0.22) l.el.setAttribute('transform', 'translate('+l.x+' '+l.y+') rotate('+l.a+') scale('+k+')');
    for (const m of MK) m.el.setAttribute('transform', 'translate('+m.p.x+' '+m.p.y+') scale('+k+')');
    if (me) $('#meDot').setAttribute('transform', 'translate('+me.x+' '+me.y+') scale('+k+')');
    if (DATA.home) $('#home').setAttribute('transform', 'translate('+DATA.home[0]+' '+DATA.home[1]+') scale('+k+')');
    // 축척 막대
    const nice = [10,20,50,100,200,500,1000,2000], m = nice.find(v => v*s >= 70) || 2000;
    $('#scale span').textContent = m >= 1000 ? (m/1000)+'km' : m+'m';
    $('#scale i').style.width = (m*s)+'px';
  }
}
let raf = 0;
const schedule = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; applyView(); }); };
let touched = false;   // 손으로 지도를 움직이기 전까지는 크기가 바뀔 때마다 이 일차에 다시 맞춘다
function resize(){
  const r = wrap.getBoundingClientRect(); W = r.width || 800; H = r.height || 600; lastK = 0;
  if (!touched && typeof day !== 'undefined' && BY.has(day) && W > 200 && H > 200) { if (resumed && sel) focusSel(); else fit(BY.get(day)); }
  else applyView();
}
['pointerdown', 'wheel'].forEach(t => wrap.addEventListener(t, () => { touched = true; }, {passive:true}));
new ResizeObserver(resize).observe(wrap);

function fit(pts, pad){
  pad = pad || 56;
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const p of pts) { x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y); }
  // 카드가 지도를 너무 많이 가리면(세로 화면) 카드 몫을 줄여 지도 높이를 절반 이상 남긴다
  const card = $('#card'), cardH = card.hidden ? 0 : Math.min(card.offsetHeight + 16, (H - pad*2)*0.5);
  view.s = clamp(Math.min((W - pad*2)/Math.max(x1-x0, 60), (H - pad*2 - cardH)/Math.max(y1-y0, 60)), 0.12, 8);
  view.x = (x0+x1)/2; view.y = (y0+y1)/2 + cardH/2/view.s;
  applyView();
}
function panTo(p){
  const sx = (p.x - view.x)*view.s + W/2, sy = (p.y - view.y)*view.s + H/2;
  const cardH = $('#card').hidden ? 0 : 170;
  if (sx > W*0.12 && sx < W*0.82 && sy > H*0.12 && sy < H - cardH - 30) return;
  const tx = p.x, ty = p.y + cardH/2/view.s, fx = view.x, fy = view.y;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { view.x = tx; view.y = ty; return applyView(); }
  const t0 = performance.now();
  (function step(t){ const u = Math.min(1, (t - t0)/260), e = 1 - Math.pow(1-u, 3);
    view.x = fx + (tx-fx)*e; view.y = fy + (ty-fy)*e; applyView(); if (u < 1) requestAnimationFrame(step); })(t0);
}
function zoomAt(f, px, py){
  const m = toMap(px, py); view.s = clamp(view.s*f, 0.12, 12);
  view.x = m.x - (px - W/2)/view.s; view.y = m.y - (py - H/2)/view.s; schedule();
}

/* 손가락: 한 손가락 이동 · 두 손가락 확대 · 짧게 톡 = 선택 */
const ptr = new Map(); let gest = null;
const rel = e => { const r = svg.getBoundingClientRect(); return {x: e.clientX - r.left, y: e.clientY - r.top}; };
svg.addEventListener('pointerdown', e => {
  svg.setPointerCapture(e.pointerId); ptr.set(e.pointerId, rel(e));
  if (ptr.size === 1) gest = {start: rel(e), t: performance.now(), moved: 0, multi: false};
  else if (gest) gest.multi = true;
});
svg.addEventListener('pointermove', e => {
  if (!ptr.has(e.pointerId)) return;
  const prev = [...ptr.values()], pOld = ptr.get(e.pointerId), pNew = rel(e);
  if (ptr.size === 1) {
    view.x -= (pNew.x - pOld.x)/view.s; view.y -= (pNew.y - pOld.y)/view.s;
    if (gest) gest.moved += Math.hypot(pNew.x - pOld.x, pNew.y - pOld.y);
    if (follow && gest && gest.moved > 12) setFollow(false);
    ptr.set(e.pointerId, pNew); schedule(); return;
  }
  const [a, b] = prev, mid0 = {x:(a.x+b.x)/2, y:(a.y+b.y)/2}, d0 = Math.hypot(a.x-b.x, a.y-b.y);
  ptr.set(e.pointerId, pNew);
  const [c, d] = [...ptr.values()], mid1 = {x:(c.x+d.x)/2, y:(c.y+d.y)/2}, d1 = Math.hypot(c.x-d.x, c.y-d.y);
  const m = toMap(mid0.x, mid0.y);
  view.s = clamp(view.s * (d0 ? d1/d0 : 1), 0.12, 12);
  view.x = m.x - (mid1.x - W/2)/view.s; view.y = m.y - (mid1.y - H/2)/view.s;
  if (follow) setFollow(false);
  schedule();
});
const up = e => {
  if (!ptr.has(e.pointerId)) return;
  ptr.delete(e.pointerId);
  if (ptr.size === 0 && gest) {
    if (!gest.multi && gest.moved < 10 && performance.now() - gest.t < 600) tap(gest.start);
    gest = null;
  }
};
svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
svg.addEventListener('wheel', e => { e.preventDefault(); const r = rel(e); zoomAt(Math.exp(-e.deltaY*0.0018), r.x, r.y); }, {passive:false});
document.addEventListener('gesturestart', e => e.preventDefault());

function tap(pt){
  const m = toMap(pt.x, pt.y);
  const near = (list, px) => { let best = null, bd = px/view.s; for (const p of list) { const d = Math.hypot(p.x-m.x, p.y-m.y); if (d < bd) { bd = d; best = p; } } return best; };
  const p = near(BY.get(day), 26) || near(P, 14);
  if (!p) return;
  if (p.day !== day) setDay(p.day, false);
  select(p, false);
}

/* ── 일차 · 선택 ─────────────────────────────────────── */
let day = ls('day'), sel = null, pos = ls('pos'), resumed = false;
if (!BY.has(day)) day = (DAYS.find(d => BY.get(d).some(p => !st(p))) || DAYS[0]);
const nextOf = (d, after) => { const L = BY.get(d); const i = after ? L.indexOf(after) : -1;
  return L.slice(i+1).find(p => !st(p)) || L.find(p => !st(p)) || null; };
function firstPendingFrom(d){
  for (const dd of DAYS.filter(x => x >= d).concat(DAYS.filter(x => x < d))) { const n = BY.get(dd).find(p => !st(p)); if (n) return n; }
  return null;
}
function resumeTarget(){
  const p = pos && P.find(q => q.pk === String(pos.pk));
  return p ? (nextOf(p.day, p) || firstPendingFrom(p.day)) : null;
}
function resume(say){
  const n = resumeTarget(); if (!n) return false;
  day = n.day; ls('day', day); sel = n; resumed = true;
  showCard(); renderDay(false); focusSel();
  if (say) toast('지난번 멈춘 곳에서 이어갑니다 — ' + n.day + '일차 ' + n.seq + '번');
  return true;
}
function focusSel(){
  if (!sel) return fit(BY.get(day));
  view.s = clamp(Math.max(view.s, 1.9), 0.12, 12);
  view.x = sel.x; view.y = sel.y + ($('#card').hidden ? 0 : 85/view.s); applyView();
}

function renderDays(){
  $('#days').innerHTML = DAYS.map(d => {
    const L = BY.get(d), n = L.filter(p => st(p) === 'done').length;
    return '<button class="day'+(n === L.length ? ' full' : '')+'" data-d="'+d+'" aria-pressed="'+(d === day)+'"><span class="n">'+d+'</span><span class="g">'+dongOf(d)+
      '</span><span class="bar"><i style="width:'+(100*n/L.length)+'%"></i></span></button>';
  }).join('');
  const all = P.filter(p => st(p) === 'done').length;
  $('#total').textContent = '전체 '+all.toLocaleString()+' / '+P.length.toLocaleString()+'곳 넣음';
}
$('#days').addEventListener('click', e => { const b = e.target.closest('.day'); if (b) setDay(+b.dataset.d, true); });

function renderDay(refit){
  const L = BY.get(day), nx = nextOf(day, null);
  // 다른 일차: 옅은 점 / 이 일차: 동선 + 번호판
  let fd = ''; for (const p of P) if (p.day !== day) fd += 'M'+p.x+' '+p.y+'h0.01';
  $('#faint').setAttribute('d', fd);
  // 동선 선: 지나온 구간은 회색 · 다음 집 가는 최단 길은 빨간 굵은 선 · 남은 구간은 옅은 남색
  const lg = DATA.legs && DATA.legs[day], ni = nx ? L.indexOf(nx) : -1, HM = DATA.home;
  let dDone = '', dTodo = '', dNext = '';
  for (let k = 0; k <= L.length; k++) {     // k번째 구간: (집 또는 앞 집) → L[k] · 맨 끝은 → 집
    const to = L[k], from = k ? L[k-1] : (HM ? {x:HM[0], y:HM[1]} : null);
    const seg = lg ? legD(lg[k]) : (from && to ? 'M'+from.x+' '+from.y+'L'+to.x+' '+to.y : '');
    if (to ? k === ni : ni === -1) dNext += seg; else if (to && st(to)) dDone += seg; else dTodo += seg;
  }
  $('#rDone').setAttribute('d', dDone); $('#rTodo').setAttribute('d', dTodo); $('#rNext').setAttribute('d', dNext);
  const rank = p => p === sel ? 4 : p === nx ? 3 : st(p) === 'done' ? 0 : st(p) === 'skip' ? 1 : 2;
  const order = L.slice().sort((a,b) => rank(a) - rank(b));
  $('#gMk').innerHTML = order.map(p => '<g class="mk '+st(p)+(p === nx ? ' next' : '')+(p === sel ? ' sel' : '')+'"><g class="b">'+
    (p === sel ? '<circle class="sel" r="17.5"/>' : '')+'<circle class="ring" r="13"/><circle class="c" r="13"/><text>'+p.seq+'</text></g></g>').join('');
  MK = [...$('#gMk').children].map((el, i) => ({el, p:order[i]}));
  lastK = 0; applyView();

  // 요약
  const done = L.filter(p => st(p) === 'done'), skip = L.filter(p => st(p) === 'skip');
  const left = L.filter(p => st(p) !== 'done').reduce((a, p) => a + p.fly, 0);
  $('#sTitle').innerHTML = day+'일차 <span>'+esc([...new Set(L.map(p => p.dong))].join(' · '))+' · '+L.length+'곳</span>';
  $('#sChips').innerHTML = '<span class="chip ok"><b>'+done.length+'</b> / '+L.length+'곳 넣음</span>'+
    (skip.length ? '<span class="chip warn">못 넣음 <b>'+skip.length+'</b></span>' : '')+
    '<span class="chip">전단 <b>'+left.toLocaleString()+'</b>장 남음</span>';
  const nb = $('#sNext');
  if (nx) { const w = walkTo(nx); nb.hidden = false;
    nb.innerHTML = '<span><span class="k">다음 집</span><br><span class="v">'+nx.seq+'번 · '+esc(nx.jibun)+(w ? ' · '+w : '')+'</span></span><span class="arr">→</span>';
    nb.onclick = () => select(nx, true); }
  else { nb.hidden = false; nb.innerHTML = '<span><span class="k">이 일차 끝</span><br><span class="v">'+(skip.length ? '못 넣은 '+skip.length+'곳만 남았습니다' : '모두 넣었습니다')+'</span></span>'; nb.onclick = null; }

  // 목록 — 골목 단위로 묶는다 (동선이 골목을 따라 돈다)
  let html = '', i = 0;
  while (i < L.length) {
    let j = i; while (j < L.length && L[j].road === L[i].road) j++;
    const g = L.slice(i, j), gd = g.filter(p => st(p) === 'done').length;
    html += '<div class="grp"><span>'+esc(L[i].road)+'</span><small>'+g[0].seq+(j-i > 1 ? '–'+g[g.length-1].seq : '')+'번 · '+gd+'/'+g.length+'</small></div>';
    for (const p of g) html += '<div class="row '+st(p)+(p === nx ? ' next' : '')+(p === sel ? ' sel' : '')+'" data-i="'+p.i+'">'+
      '<span class="no">'+p.seq+'</span><div style="min-width:0"><div class="j">'+esc(p.jibun)+'</div><div class="r">'+esc(p.road+' '+p.bno)+'</div></div>'+
      '<span class="t"><b>'+p.fly+'장</b>'+esc(p.type)+'</span><button class="tick" aria-label="'+p.seq+'번 넣음 표시">✓</button></div>';
    i = j;
  }
  const rows = $('#rows'), keep = rows.scrollTop; rows.innerHTML = html; rows.scrollTop = keep;
  renderDays();
  if (refit) fit(L);
}
function setDay(d, refit){ day = d; ls('day', d); sel = null; $('#card').hidden = true; $('#rows').scrollTop = 0; renderDay(refit); }

$('#rows').addEventListener('click', e => {
  const row = e.target.closest('.row'); if (!row) return;
  const p = P[+row.dataset.i];
  if (e.target.closest('.tick')) { mark(p, st(p) === 'done' ? null : 'done'); if (sel === p) showCard(); renderDay(false); return; }
  select(p, true);
});

function select(p, pan){
  sel = p; showCard(); renderDay(false);
  if (pan) panTo(p);
  const row = $('#rows .row[data-i="'+p.i+'"]');
  if (row) { const r = row.getBoundingClientRect(), c = $('#rows').getBoundingClientRect();
    if (r.top < c.top + 30 || r.bottom > c.bottom) row.scrollIntoView({block:'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); }
}
function showCard(){
  const p = sel; if (!p) { $('#card').hidden = true; return; }
  $('#card').hidden = false;
  $('#cRoad').textContent = p.road; $('#cNo').textContent = p.bno;
  const s = st(p);
  const isNx = !s && p === nextOf(p.day, null), w = walkTo(p);
  $('#cJ').innerHTML = esc(p.jibun) + (s ? '<span class="st '+s+'">'+(s === 'done' ? '넣음' : '못 넣음')+'</span>'
    : isNx ? '<span class="st nx">다음 집'+(w ? ' · '+w : '')+'</span>' : '');
  const yr = /^\d{4}/.test(p.appr) ? p.appr.slice(0,4)+'년 사용승인' : '';
  $('#cMeta').innerHTML = p.day+'일차 '+p.seq+'번째 · '+esc(p.type)+(p.fl ? ' · '+esc(p.fl)+'층' : '')+(yr ? ' · '+yr : '')+' · <b>전단 '+p.fly+'장</b>';
  $('#cNote').textContent = p.note || ''; $('#cNote').hidden = !p.note;
  $('#aUndo').hidden = !s; $('#aSkip').hidden = s === 'skip';
  $('#aDone').textContent = s === 'done' ? '다음 집으로' : '넣었음 · 다음 집';
  $('#aNav').href = 'https://map.kakao.com/link/to/' + encodeURIComponent(p.jibun) + ',' + p.lat + ',' + p.lon;
}
function advance(){
  const n = nextOf(day, sel); if (n) return select(n, true);
  sel = null; showCard(); renderDay(false);
  const nd = firstPendingFrom(day < DAYS[DAYS.length-1] ? day + 1 : DAYS[0]);
  toast(day + '일차를 모두 돌았습니다. 빨간 선이 집으로 가는 길입니다.' + (nd ? ' 다음은 ' + nd.day + '일차 — 위 번호 ' + nd.day + '을 누르세요.' : ''));
}
$('#aDone').onclick = () => { if (st(sel) !== 'done') mark(sel, 'done'); advance(); };
$('#aSkip').onclick = () => { mark(sel, 'skip'); advance(); };
$('#aUndo').onclick = () => { mark(sel, null); showCard(); renderDay(false); };
$('#cX').onclick = () => { sel = null; showCard(); renderDay(false); };
$('#bFit').onclick = () => fit(BY.get(day));
$('#bIn').onclick = () => zoomAt(1.6, W/2, H/2);
$('#bOut').onclick = () => zoomAt(1/1.6, W/2, H/2);

/* ── 내 위치 ─────────────────────────────────────────── */
let me = null, follow = false, watchId = null;
function setFollow(v){ follow = v; $('#bMe').setAttribute('aria-pressed', String(v)); }
$('#bMe').onclick = () => {
  if (!('geolocation' in navigator)) return toast('이 기기에서는 위치를 받을 수 없습니다. 번호 순서대로 찾아가 주세요.');
  if (me) { setFollow(true); panTo(me); if (view.s < 1.2) { view.s = 1.8; applyView(); } return; }
  const pol = document.permissionsPolicy || document.featurePolicy;
  if (pol && pol.allowsFeature && !pol.allowsFeature('geolocation'))
    return toast('이 지도가 열린 보기 화면이 위치 기능을 막고 있습니다. 번호 순서대로 찾아가시거나 「카카오맵 길찾기」를 써 주세요. [보기 화면 차단]', 10000);
  toast('내 위치를 찾는 중입니다…');
  const t0 = Date.now();
  setFollow(true);
  watchId = navigator.geolocation.watchPosition(pos => {
    const c = pos.coords, first = !me;
    me = {x: (c.longitude - DATA.cx)*DATA.kx, y: -(c.latitude - DATA.cy)*DATA.ky, acc: c.accuracy};
    const a = $('#meAcc'); a.style.display = ''; a.setAttribute('cx', me.x); a.setAttribute('cy', me.y); a.setAttribute('r', Math.min(me.acc, 300));
    $('#meDot').style.display = ''; lastK = 0;
    if (first) { hideToast(); if (Math.abs(me.x) > 6000 || Math.abs(me.y) > 6000) toast('지금 위치가 배포 구역 밖입니다. 구역에 들어오면 파란 점이 따라옵니다.'); else { view.s = Math.max(view.s, 1.8); } }
    if (follow && Math.abs(me.x) < 6000 && Math.abs(me.y) < 6000) { view.x = me.x; view.y = me.y + ($('#card').hidden ? 0 : 85/view.s); }
    applyView();
  }, err => {
    setFollow(false);
    const why = err.code === 1
      ? (Date.now() - t0 < 1500
          ? '위치 권한이 묻지도 않고 거절됐습니다. 휴대폰 설정에서 이 앱(또는 브라우저)의 위치 권한이 꺼져 있거나, 보기 화면이 위치를 막고 있습니다.'
          : '위치 사용을 허용하지 않으셨습니다. 다시 누르면 다시 묻습니다.')
      : err.code === 3 ? '20초 안에 위치를 못 잡았습니다. 하늘이 트인 곳에서 다시 눌러 주세요.'
      : '위치를 아직 못 잡았습니다. 하늘이 트인 곳에서 다시 눌러 주세요.';
    toast(why + ' [코드 ' + err.code + (err.message ? ' · ' + err.message : '') + ']', 10000);
    if (watchId !== null) navigator.geolocation.clearWatch(watchId); watchId = null;
  }, {enableHighAccuracy:true, maximumAge:5000, timeout:20000});
};

let tt = 0;
function toast(m, ms){ const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(hideToast, ms || 4200); }
function hideToast(){ $('#toast').hidden = true; }

/* ── 휴대폰 목록 서랍 ─────────────────────────────────── */
const MQ = matchMedia('(max-aspect-ratio:1/1), (max-width:760px)');
const sheet = document.querySelector('.list');
function setSheet(open){
  sheet.classList.toggle('open', open);
  $('#sheetBar').setAttribute('aria-expanded', String(open));
  $('#sbA').textContent = open ? '접기 ▼' : '펼치기 ▲';
}
$('#sheetBar').onclick = () => setSheet(!sheet.classList.contains('open'));
function syncSheetBar(){
  const t = $('#sTitle'), ok = document.querySelector('#sChips .chip.ok');
  $('#sbL').textContent = (t && t.firstChild ? t.firstChild.textContent.trim() : '') || '목록';
  $('#sbS').textContent = ok ? ok.textContent.trim() : '';
}
new MutationObserver(syncSheetBar).observe(document.querySelector('.sum'), {childList:true, subtree:true, characterData:true});
// 목록에서 집을 고르면 서랍을 내려 지도를 보여 준다 (체크 버튼은 그대로)
$('#rows').addEventListener('click', e => { if (MQ.matches && e.target.closest('.row') && !e.target.closest('.tick')) setSheet(false); });
$('#sNext').addEventListener('click', () => { if (MQ.matches) setSheet(false); });

$('#bList').onclick = () => setSheet(!sheet.classList.contains('open'));
new MutationObserver(() => $('#bList').setAttribute('aria-pressed', String(sheet.classList.contains('open'))))
  .observe(sheet, {attributes:true, attributeFilter:['class']});

/* ── 시작 ───────────────────────────────────────────── */
if (DATA.home) $('#home').style.display = '';
resize();
if (!resume(true)) { sel = nextOf(day, null); showCard(); renderDay(false); fit(BY.get(day)); }
setSync();
syncSheetBar();
</script>

0OnN8X", n:250000}, KEY = "flyer-key:songpa";
  const b64 = t => Uint8Array.from(atob(t), ch => ch.charCodeAt(0));
  const toB64 = u => { let r = ""; for (let x = 0; x < u.length; x++) r += String.fromCharCode(u[x]); return btoa(r); };
  async function derive(pw){
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", salt:b64(ENC.s), iterations:ENC.n, hash:"SHA-256"}, base, 256));
  }
  async function unseal(raw){
    const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(ENC.i)}, key, b64(ENC.c)));
  }
  function boot(json){
    document.getElementById("lock").remove();
    const sc = document.createElement("script");
    sc.textContent = "const DATA = " + json + ";\n" + document.getElementById("appsrc").textContent;
    document.body.appendChild(sc);
  }
  const lock = document.getElementById("lock"), err = document.getElementById("lockerr");
  (async () => {
    let saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) {}
    if (saved) { try { boot(await unseal(b64(saved))); return; } catch (e) { try { localStorage.removeItem(KEY); } catch (_) {} } }
    lock.hidden = false; document.getElementById("lockpw").focus();
  })();
  document.getElementById("lockf").addEventListener("submit", async e => {
    e.preventDefault(); err.textContent = "여는 중…";
    try {
      const raw = await derive(document.getElementById("lockpw").value);
      const json = await unseal(raw);
      if (document.getElementById("lockrem").checked) { try { localStorage.setItem(KEY, toB64(raw)); } catch (_) {} }
      boot(json);
    } catch (x) { err.textContent = "비밀번호가 맞지 않습니다."; }
  });
})();
